<html>
<head>
<title> Student Registration Form </title>
</head>
<body>
<h1 align="center">Student Registration Form</h1>
<form>
<table align="center" cellpadding="8">
<tr>
<td><label for="name">Name:</label></td>
<td>
<input type="text" id="name" name="name">
</td>
</tr>
<tr>
<td><label for="fname">Father's Name:</label></td>
<td>
<input type="text" id="fname" name="fname">
</td>
  <tr>
<td>Gender:</td>
<td> 
<input type="radio" id="male" name="gender" name="gender" value:<label for="male">Male</label>
<input type="radio" id="female" name="gender" name="gender" value:<label for="female">female</label>
</td>
</tr>
<tr>
<td> <label for="dob">Date of Birth:</label></td>
<td>
<input type="date" id="dob" name="dob"></td>
</tr>
<tr>
<td><label for="trade">Trade:</label></td>
<td>
<select id="trade" name="trade">
<option value=" ">--Select Trade--</option>
<option>Plumber</option>
<option>Fitter</option>
<option>Electrician</option>
<option>Information Technology</option>
<option>Sewing Technology</option>
</select>
</td>
</tr>
<tr>
<td><label for="address">Address:</label></td>
<td>
<textarea id="address" name="address" rows="4"required></textarea></td>
</tr>
<tr>
<td><label for="mobile">Mobile Number:</label></td>
<td>
<input type="tel" id="mobile"name="mobile">
</td>
</tr>
<tr>
<td><label for="email"> Email:</label></td>
<td>
<input type="email" id="email" name="email">
</td>
</tr>
<tr>
<td>Hobbies:</td>
<td>
<input type="checkbox" id="reading" name="hobby">
<label for"reading">Reading</label>
<input type="checkbox" id="music" name="hobby">
<label for"music">music</label>
<input type="checkbox" id="sports" name="hobby">
<label for"sports">Sports</label>
<input type="checkbox" id="travel" name="hobby">
<label for"sports">travelling</label>
</td>
</tr>
<tr>
<td><label for="file">Upload file:</label></td>
<td>
<input type="file" id="file" name="file">
</td>
</tr>
<tr>
<td colspan="2" align="center">
<input type="submit" value="submit">
<input type="reset" value="Reset">
</td>
</tr>
</table>
</form>
</body>
</html>
